services:
  - type: web
    name: mandiiq
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandiiq-db
          property: connectionString
      - key: PORT
        value: "8501"

databases:
  - name: mandiiq-db
    plan: free
    databaseName: mandiiq
    user: mandiiq_user
